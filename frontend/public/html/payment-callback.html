<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirming Payment...</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- This page only appears if you use Paystack's full-page REDIRECT flow
       (via /api/payments/initialize) instead of the inline popup already
       wired up on the student dashboard. It reads the "reference" Paystack
       puts in the URL, verifies it, then sends the student back to their dashboard. -->
  <div class="login-wrapper">
    <div class="login-card" style="text-align:center;">
      <h3 id="status-heading">Confirming your payment...</h3>
      <p id="status-text" style="color:var(--color-muted); margin-top:10px;">Please wait a moment.</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');

    // Paystack appends the transaction reference as a URL query parameter, e.g. ?reference=abc123
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference') || params.get('trxref');

    async function confirm() {
      if (!token || !reference) {
        document.getElementById('status-heading').textContent = 'Something went wrong.';
        document.getElementById('status-text').textContent = 'Missing payment reference or login session.';
        return;
      }

      try {
        const response = await fetch(`/api/payments/verify/${reference}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await response.json();

        if (response.ok) {
          document.getElementById('status-heading').textContent = 'Payment Successful!';
          document.getElementById('status-text').textContent = 'Redirecting to your dashboard...';
        } else {
          document.getElementById('status-heading').textContent = 'Payment Not Confirmed';
          document.getElementById('status-text').textContent = data.message || 'Please contact the school office.';
        }
      } catch (error) {
        document.getElementById('status-heading').textContent = 'Network Error';
        document.getElementById('status-text').textContent = 'Could not reach the server.';
      }

      // Send the student back to their dashboard after a short pause either way
      setTimeout(() => (window.location.href = '/student-dashboard.html'), 2500);
    }

    confirm();
  </script>
</body>
</html>
